<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ शुभ दीपावली ✨</title>

<meta property="og:title" content="आपके लिए एक सरप्राइज गिफ्ट! 🎁">
<meta property="og:description" content="जल्दी से अपना सीक्रेट गिफ्ट देखें!">
<meta property="og:type" content="website">
<meta property="og:image" content="https://i.ibb.co/YBysrK61/Screenshot-2026-11-04-15-42-50-97.jpg">

<link href="https://fonts.googleapis.com/css2?family=Laila:wght@600;700&family=Noto+Sans+Devanagari:wght@500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --gold:#ffd700;
  --orange:#ff8c00;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  width:100%;
  min-height:100%;
  background:#280202;
  color:white;
  font-family:'Noto Sans Devanagari',sans-serif;
}

body {
  min-height:100vh;
  overflow-x:hidden;
  background:radial-gradient(circle at 50% 25%,#a20d20,#4a0404 55%,#160000);
}

#rgb-bg {
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(circle,#b3123a,#1f0510);
  animation:colors 18s infinite alternate;
}

@keyframes colors {
  0% {filter:hue-rotate(0deg);}
  50% {filter:hue-rotate(100deg);}
  100% {filter:hue-rotate(220deg);}
}

#crackers {
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:2;
}

.cracker {
  position:absolute;
  top:-30px;
  animation:fall linear infinite;
}

@keyframes fall {
  to {transform:translateY(110vh) rotate(600deg);}
}

#celebration-screen {
  position:relative;
  z-index:5;
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:12px 14px 80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-around;
  gap:12px;
}

.top-hero-section {
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.happy-diwali-banner {
  padding:7px 28px;
  margin:8px 0 14px;
  border-radius:40px;
  background:linear-gradient(135deg,#c71585,#ff4500,#ffd700);
  border:2px solid #ffeb73;
  box-shadow:0 0 22px #ff8c00;
}

.happy-diwali-text {
  font-family:'Laila',sans-serif;
  font-size:clamp(25px,6vw,36px);
  font-weight:700;
  white-space:nowrap;
}

.laxmi-image-wrapper {
  width:100%;
  display:flex;
  justify-content:center;
}

.festive-img {
  display:block;
  width:100%;
  max-width:280px;
  max-height:170px;
  object-fit:contain;
  border-radius:12px;
  border:2px solid var(--gold);
  box-shadow:0 0 25px #ffd700;
  animation:pulse 3s infinite;
}

@keyframes pulse {
  50% {transform:scale(1.04);}
}

.greeting-box,.controls-section {
  width:100%;
  padding:12px;
  background:rgba(0,0,0,.7);
  border:1.5px solid var(--gold);
  border-radius:14px;
  text-align:center;
  box-shadow:0 0 15px #ffd70033;
}

.greeting-text {
  font-size:clamp(16px,4vw,20px);
  line-height:1.6;
}

#display-name {
  font-weight:800;
  color:var(--gold);
  animation:nameColor 5s linear infinite;
}

@keyframes nameColor {
  0% {color:#ff3030;}
  25% {color:#ffff00;}
  50% {color:#00ff99;}
  75% {color:#00ccff;}
  100% {color:#ff30c0;}
}

.controls-section {
  display:flex;
  flex-direction:column;
  gap:12px;
}

.neon-input {
  width:100%;
  padding:12px;
  border:2px solid var(--orange);
  border-radius:9px;
  background:#240000;
  color:white;
  font-size:16px;
  font-family:inherit;
  outline:none;
  user-select:text;
}

.neon-input:focus {
  border-color:var(--gold);
  box-shadow:0 0 12px var(--gold);
}

.gift-img-btn,.wa-img-btn {
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  text-decoration:none;
  position:relative;
}

.gift-img-btn img,.wa-img-btn img {
  max-width:100%;
  max-height:84px;
  object-fit:contain;
}

.gift-img-btn img {
  animation:pulse 2s infinite;
}

.wa-img-btn img {
  animation:pulse 2.8s infinite;
}

.text-btn {
  width:100%;
  min-height:52px;
  border-radius:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  text-decoration:none;
  color:white;
  font-size:17px;
  border:1px solid white;
}

.amazon-fallback {
  background:linear-gradient(135deg,#ff8c00,#c71585);
}

.wa-fallback {
  background:linear-gradient(135deg,#25d366,#128c7e);
}

.adsterra-bottom-slot {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:60px;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.85);
}

.adsterra-bottom-slot iframe {
  max-width:100%;
}

@media(max-height:650px) {
  #celebration-screen {
    justify-content:flex-start;
    gap:8px;
  }
  .festive-img {
    max-height:110px;
  }
  .happy-diwali-banner {
    margin:3px 0 7px;
  }
}
</style>

<!-- POPUNDER AD -->

src="https://afders.org/1/941948f6e99c104a0c4b6e9b5d510d91"></script>

</head>

<body>

<div id="rgb-bg"></div>
<div id="crackers"></div>

<main id="celebration-screen">

  <div class="top-hero-section">

    <div class="happy-diwali-banner">
      <div class="happy-diwali-text">शुभ दीपावली 🪔</div>
    </div>

    <div class="laxmi-image-wrapper">
      <img
        src="https://i.ibb.co/vx9K98Zv/laxmi.gif"
        class="festive-img"
        alt="माता लक्ष्मी"
        onerror="this.style.display='none';document.getElementById('fallback').style.display='block';"
      >
      <div id="fallback" style="display:none;font-size:90px">🪔</div>
    </div>

  </div>

  <div class="greeting-box">
    <p class="greeting-text">
      <span id="display-name">आपका नाम</span> की ओर से:<br>
      आपको दीपावली की बहुत-बहुत बधाई। 🎉
    </p>
  </div>

  <div class="controls-section">

    <input
      type="text"
      id="name-input"
      class="neon-input"
      placeholder="यहाँ अपना नाम लिखें"
      maxlength="40"
      autocomplete="off"
    >

    <!-- AMAZON AFFILIATE LINK: अपना असली लिंक डालें -->
    <a
      href="YOUR_AFFILIATE_LINK"
      id="gift-btn"
      class="text-btn amazon-fallback"
      target="_blank"
      rel="noopener"
    >
      🧨 दिवाली शॉपिंग धमाका 🧨
    </a>

    <!-- WHATSAPP SHARE -->
    <a
      href="#"
      id="whatsapp-share-btn"
      class="text-btn wa-fallback"
    >
      💚 WhatsApp पर शेयर करें
    </a>

  </div>

</main>

<!-- FIXED BOTTOM BANNER AD 320x50 -->
<div class="adsterra-bottom-slot">

  <script>
    var atOptions = {
      'key': '8241f998ec1c1693f0860fc6d1d1c581',
      'format': 'iframe',
      'height': 50,
      'width': 320,
      'params': {}
    };
  </script>

  <script src="https://bicea.org/22/8241f998ec1c1693f0860fc6d1d1c581"></script>

</div>

<script>
(function(){

  var input = document.getElementById('name-input');
  var display = document.getElementById('display-name');
  var wa = document.getElementById('whatsapp-share-btn');

  function cleanName(value) {
    return value.replace(/^\s+|\s+$/g,'');
  }

  input.addEventListener('input',function(){
    display.textContent = cleanName(input.value) || 'आपका नाम';
  });

  // URL se naam lena
  var params = new URLSearchParams(location.search);
  var sharedName = params.get('name');

  if(sharedName) {
    input.value = sharedName;
    display.textContent = sharedName;
  }

  wa.addEventListener('click',function(e){
    e.preventDefault();

    var name = cleanName(input.value);

    if(!name) {
      input.focus();
      alert('पहले अपना नाम लिखें!');
      return;
    }

    var base = 'https://diwaliloot.vercel.app/';
    var shareURL = base + '?name=' + encodeURIComponent(name);

    var message =
      '🚨 जल्दी देखो! 🚨\n\n' +
      name +
      ' ने आपके लिए दिवाली का एक बहुत ही सीक्रेट गिफ्ट भेजा है 🎁👇\n\n' +
      'यहाँ क्लिक करें 👉 ' + shareURL;

    location.href = 'https://wa.me/?text=' +
      encodeURIComponent(message);
  });

  // Falling Diwali decorations
  var container = document.getElementById('crackers');
  var items = ['✨','🪔','🎆','⭐','🎇'];

  for(var i=0;i<18;i++){
    var el = document.createElement('span');
    el.className = 'cracker';
    el.textContent = items[i % items.length];
    el.style.left = Math.random()*100 + '%';
    el.style.animationDuration = (7+Math.random()*9)+'s';
    el.style.animationDelay = (-Math.random()*12)+'s';
    el.style.fontSize = (13+Math.random()*15)+'px';
    container.appendChild(el);
  }

})();
</script>

</body>
</html>
