  <!-- STATUS PANEL (test ke liye): sab OK ho to 5 sec baad khud hat jata hai. Hamesha ke liye band karna ho to DEBUG_ALWAYS = false -->
  <script>
  (function () {
    var DEBUG_ALWAYS = false;
    var dbg = DEBUG_ALWAYS || /[?&]debug=1/.test(location.search), box = null, hasErr = false;
    function show(t) {
      if (!dbg) { if (/ERROR|FAIL/.test(t)) hasErr = true; return; }
      if (/ERROR|FAIL/.test(t)) hasErr = true;
      if (!box) {
        box = document.createElement('pre');
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b00020;color:#fff;font:11px/1.35 monospace;padding:6px;margin:0;white-space:pre-wrap;max-height:45vh;overflow:auto;pointer-events:none';
        (document.body || document.documentElement).appendChild(box);
      }
      box.textContent += t + '\n';
    }
    window.__dbg = show;
    window.__dbgDone = function () {
      if (!hasErr && box) setTimeout(function () { if (box && box.parentNode) box.parentNode.removeChild(box); }, 5000);
    };
    window.addEventListener('error', function (e) {
      show('ERROR: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')');
    });
    show('FILE v4 loaded');
  })();
  </script>

  <style>
    :root {
      --bg-deep-maroon: #4a0404;
      --bg-dark-red: #1f0101;
      --warm-gold: #ffd700;
      --warm-orange: #ff8c00;
      --light-gold: #ffeb73;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Noto Sans Devanagari', 'Poppins', 'Laila', sans-serif;
      background: radial-gradient(circle at 50% 30%, #7a0808 0%, var(--bg-deep-maroon) 50%, var(--bg-dark-red) 100%);
      color: #ffffff;
      position: fixed;
      top: 0;
      left: 0;
    }

    #celebration-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Main Container with 80px bottom space for the fixed ad slot */
    #celebration-screen {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 520px;
      margin: 0 auto;
      padding: 8px 14px 80px 14px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .top-hero-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 1 auto;
      margin-top: 4px;
    }

    .happy-diwali-banner {
      padding: 6px 26px;
      margin-bottom: 10px;
      border-radius: 40px;
      background: linear-gradient(135deg, #c71585 0%, #ff4500 50%, #ffd700 100%);
      box-shadow: 0 4px 15px rgba(255, 140, 0, 0.6);
      border: 1.5px solid var(--light-gold);
    }

    .happy-diwali-text {
      font-family: 'Laila', 'Noto Sans Devanagari', sans-serif;
      font-size: clamp(1.4rem, 5.5vw, 2.2rem);
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
    }

    .laxmi-image-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes softPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    .festive-img {
      display: block;
      width: 100%;
      max-width: 280px;
      max-height: 150px;
      max-height: min(170px, 24vh);
      min-height: 60px;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      border: 2px solid var(--warm-gold);
      box-shadow: 0 4px 22px rgba(255, 215, 0, 0.6);
      animation: softPulse 3s infinite ease-in-out;
    }

    /* Shown only if no image file could be loaded */
    .img-fallback {
      display: none;
      font-size: 90px;
      line-height: 1;
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.8));
      animation: softPulse 3s infinite ease-in-out;
    }

    .greeting-box {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid var(--warm-gold);
      text-align: center;
      margin: 6px 0;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
    }

    .greeting-text {
      font-size: clamp(0.95rem, 3.8vw, 1.2rem);
      line-height: 1.4;
      font-weight: 600;
      color: #fffdf5;
      word-wrap: break-word;
    }

    #display-name {
      display: inline-block;
      font-weight: 800;
      color: var(--warm-gold);
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    .controls-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 4px;
      border: 1.5px solid var(--warm-gold);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
    }

    .neon-input {
      width: 100%;
      background: rgba(30, 0, 0, 0.85);
      color: #ffffff;
      border: 1.5px solid var(--warm-orange);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 16px; /* 16px stops mobile browsers zooming on focus */
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .neon-input:focus {
      border-color: var(--warm-gold);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }

    /* Image button: 🧨 दिवाली शॉपिंग धमाका 🧨 */
    .gift-img-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      overflow: hidden;
      border-radius: 40px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .gift-img-btn img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 84px; /* button bada chahiye to ye number badhao */
      object-fit: contain;
      pointer-events: none;
    }

    /* Slow light sweep that repeats */
    .gift-img-btn .shine {
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.55) 50%, transparent 100%);
      transform: translateX(-150%) skewX(-20deg);
      animation: shineSweep 3.2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes shineSweep {
      0%, 55% { transform: translateX(-150%) skewX(-20deg); }
      100%    { transform: translateX(325%) skewX(-20deg); }
    }

    /* Little twinkling stars */
    .gift-img-btn .spark {
      position: absolute;
      font-size: 14px;
      opacity: 0;
      animation: twinkle 2.4s infinite ease-in-out;
      pointer-events: none;
    }
    .gift-img-btn .s1 { top: 8%;  left: 22%; animation-delay: 0s; }
    .gift-img-btn .s2 { top: 55%; left: 48%; animation-delay: 0.8s; }
    .gift-img-btn .s3 { top: 12%; right: 20%; animation-delay: 1.6s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      50%      { opacity: 1; transform: scale(1.3); }
    }

    /* Flash when tapped */
    .gift-img-btn.flash img {
      animation: tapFlash 0.35s ease-out;
    }

    @keyframes tapFlash {
      0%   { filter: brightness(1);   transform: scale(1); }
      40%  { filter: brightness(2.2); transform: scale(1.06); }
      100% { filter: brightness(1);   transform: scale(1); }
    }

    /* ===== WhatsApp image button ===== */
    .wa-img-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .wa-wrap {
      position: relative;
      isolation: isolate;
      display: inline-block;
      max-width: 100%;
      line-height: 0;
    }

    .wa-wrap img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 84px; /* button bada chahiye to ye number badhao */
      object-fit: contain;
      pointer-events: none;
      /* green glow dheere-dheere pulse + halka bounce */
      animation: waBounce 2.8s infinite ease-in-out;
    }

    .wa-wrap::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 40px;
      z-index: -1;
      box-shadow: 0 0 16px 5px rgba(37, 211, 102, 0.85);
      opacity: 0.3;
      animation: waGlowOp 3s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes waGlowOp {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 1; }
    }

    @keyframes waGlow {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(37, 211, 102, 0.30)); }
      50%      { filter: drop-shadow(0 0 13px rgba(37, 211, 102, 0.85)); }
    }

    @keyframes waBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-2px) scale(1.025); }
    }

    /* Clip layer: shine + ripple stay inside the button */
    .wa-clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 40px;
      pointer-events: none;
    }

    /* Subtle shine: ~3 sec me ek baar */
    .wa-clip .wa-shine {
      position: absolute;
      top: 0;
      left: 0;
      width: 35%;
      height: 100%;
      background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.28) 50%, transparent 100%);
      transform: translateX(-171%) skewX(-20deg);
      animation: waShine 3s infinite ease-in-out;
    }

    @keyframes waShine {
      0%, 60% { transform: translateX(-171%) skewX(-20deg); }
      100%    { transform: translateX(371%) skewX(-20deg); }
    }

    /* Tap ripple */
    .wa-ripple {
      position: absolute;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      background: rgba(255, 255, 255, 0.55);
      transform: scale(0);
      animation: waRipple 0.6s ease-out forwards;
      pointer-events: none;
    }

    @keyframes waRipple {
      to { transform: scale(18); opacity: 0; }
    }

    /* Golden sparkles around the button (kabhi-kabhi) */
    .wa-spark {
      position: absolute;
      color: var(--warm-gold);
      font-size: 13px;
      line-height: 1;
      opacity: 0;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.9);
      animation: waTwinkle 5s infinite ease-in-out;
      pointer-events: none;
    }
    .wa-spark.k1 { top: -6px;    left: 12%;  animation-delay: 0s; }
    .wa-spark.k2 { top: -8px;    right: 14%; animation-delay: 1.7s; }
    .wa-spark.k3 { bottom: -6px; left: 28%;  animation-delay: 3.1s; }
    .wa-spark.k4 { bottom: -7px; right: 24%; animation-delay: 0.9s; }
    .wa-spark.k5 { top: 38%;     left: -7px; animation-delay: 2.4s; }
    .wa-spark.k6 { top: 42%;     right: -7px; animation-delay: 4s; }

    @keyframes waTwinkle {
      0%, 70%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      80%           { opacity: 1; transform: scale(1.2) rotate(20deg); }
      90%           { opacity: 0.4; transform: scale(0.8) rotate(40deg); }
    }

    /* 2-3 Diwali sparkles that fly out on tap */
    .wa-burst {
      position: absolute;
      font-size: 16px;
      line-height: 1;
      pointer-events: none;
      z-index: 5;
      animation: waBurst 0.75s ease-out forwards;
    }

    @keyframes waBurst {
      0%   { opacity: 1; transform: translate(0, 0) scale(0.6); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); }
    }

    /* Fixed Bottom Adsterra Banner Slot (320x50) */
    .adsterra-bottom-slot {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      text-align: center;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===== RGB colour-changing background ===== */
    #rgb-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 30%, #b3123a 0%, #5c0a24 50%, #1f0510 100%);
    }
    #rgb-bg::before, #rgb-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      will-change: opacity;
    }
    #rgb-bg::before {
      background: radial-gradient(circle at 50% 30%, #12a34a 0%, #0a4a2a 50%, #031a0e 100%);
      animation: bgFade 18s ease-in-out infinite;
    }
    #rgb-bg::after {
      background: radial-gradient(circle at 50% 30%, #2a4fd6 0%, #14226b 50%, #070b24 100%);
      animation: bgFade 18s ease-in-out infinite;
      animation-delay: -9s;
    }
    @keyframes bgFade {
      0%        { opacity: 0; }
      15%, 30%  { opacity: 1; }
      40%, 100% { opacity: 0; }
    }

    /* ===== Slowly falling crackers (few, slow motion) ===== */
    #crackers {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .cracker {
      position: absolute;
      top: -12vh;
      line-height: 1;
      opacity: 0.9;
      animation: crackerFall linear infinite;
      will-change: transform;
    }

    @keyframes crackerFall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
      25%  { transform: translate3d(var(--sway), 28vh, 0) rotate(calc(var(--spin) * 0.25)); }
      50%  { transform: translate3d(calc(var(--sway) * -1), 56vh, 0) rotate(calc(var(--spin) * 0.5)); }
      75%  { transform: translate3d(var(--sway), 84vh, 0) rotate(calc(var(--spin) * 0.75)); }
      100% { transform: translate3d(0, 120vh, 0) rotate(var(--spin)); }
    }

    /* ===== RGB name text (display name + typing box) ===== */
    @keyframes rgbText {
      0%   { color: hsl(0, 100%, 62%); }
      17%  { color: hsl(60, 100%, 58%); }
      33%  { color: hsl(120, 100%, 58%); }
      50%  { color: hsl(180, 100%, 58%); }
      67%  { color: hsl(240, 100%, 68%); }
      83%  { color: hsl(300, 100%, 66%); }
      100% { color: hsl(360, 100%, 62%); }
    }

    #display-name {
      animation: rgbText 5s linear infinite;
      text-shadow: 0 0 10px currentColor;
    }

    .neon-input {
      animation: rgbText 5s linear infinite;
      caret-color: #ffffff;
      font-weight: 700;
    }

    /* Text fallback if the WhatsApp image cannot load */
    .wa-wrap.wa-text-mode {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      line-height: 1.2;
      border-radius: 40px;
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      border: 1px solid #7bffb1;
      animation: waGlowBox 3s infinite ease-in-out;
    }
    .wa-text-label { color: #fff; font-weight: 700; font-size: 1.05rem; }
    @keyframes waGlowBox {
      0%, 100% { box-shadow: 0 0 4px rgba(37, 211, 102, 0.3); }
      50%      { box-shadow: 0 0 14px rgba(37, 211, 102, 0.85); }
    }
  </style>
</head>
